<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch with Gemini</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4285F4; /* Google Blue */
            --bg: #FFFFFF; 
            --text: #202124;
            --gray: #F1F3F4;
        }
        
        /* Typography */
        body { 
            font-family: 'Google Sans', 'Product Sans', 'Open Sans', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
            line-height: 1.6; 
            text-align: center;
        }
        
        .container { padding: 10px; }
        .hidden { display: none !important; }
        
        /* --- LOGO STYLING --- */
        
        .event-logo { 
            max-height: 60px; 
            width: auto;
            margin: 0 auto 20px auto; 
            display: block; 
        }
        
        /* Gemini Logo: Lifted higher (top: -8px) */
        .gemini-inline-logo {
            height: 1.5em; 
            vertical-align: middle; 
            margin: 0 8px; 
            position: relative;
            top: -8px; 
        }

        /* Headings: Bold */
        h1 { 
            color: var(--text); 
            margin-bottom: 10px; 
            font-weight: 700; 
            font-size: 1.8rem; 
        }
        
        h2 { 
            font-size: 1.4rem; 
            margin-bottom: 0.5rem; 
            color: var(--text); 
            font-weight: 700; 
        }
        
        p { color: #5f6368; margin-bottom: 30px; font-size: 1.1rem; }
        
        /* Helper text for dietaries */
        .subtitle {
            font-size: 0.9rem;
            color: #70757a;
            margin-bottom: 20px;
            margin-top: 0;
            font-weight: 400; 
        }
        
        /* Inputs */
        textarea { 
            width: 90%; 
            padding: 15px; 
            border: 2px solid #dadce0; 
            border-radius: 12px; 
            font-family: inherit; 
            margin: 10px auto; 
            resize: vertical; 
            min-height: 80px; 
            font-size: 1rem;
            display: block;
        }
        textarea:focus { border-color: var(--primary); outline: none; }
        
        /* Standard Toggle Buttons (Full Width) */
        .btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 1px solid #dadce0; 
            border-radius: 24px; 
            background: #fff; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: 0.2s; 
            font-weight: 500; 
            color: #3c4043; 
        }
        .btn:hover { background: #f8f9fa; }
        
        .btn.selected { 
            background: #e8f0fe; 
            color: #1967d2; 
            border-color: #e8f0fe; 
            font-weight: 600;
        }
        
        /* Action Button Base Style (Blue) */
