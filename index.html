<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Menu Concierge</title>
    <style>
        :root { --primary: #4285F4; --bg: #f0f4f8; --card: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #333; padding: 20px; max-width: 500px; margin: 0 auto; }
        
        .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 20px; }
        .hidden { display: none; }
        
        h1 { color: var(--primary); margin-bottom: 10px; }
        h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #444; }
        
        /* Interactive Elements */
        textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit; margin: 10px 0; resize: vertical; min-height: 80px;}
        .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 50px; background: #e0e0e0; font-size: 1rem; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .btn.selected { background: #d0e1fd; color: var(--primary); border: 2px solid var(--primary); }
        .btn-action { background: var(--primary); color: white; margin-top: 15px; box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3); }
        .btn-action:disabled { background: #ccc; cursor: not-allowed; }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Results */
        .ai-reasoning { font-style: italic; color: #555; background: #eef; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; border-left: 4px solid var(--primary); }
        .menu-item { text-align: left; background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee; }
        .item-name { font-weight: bold; font-size: 1.1rem; color: #222; }
        .item-desc { font-size: 0.9rem; color: #666; margin-top: 5px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>
<body>

    <div id="step-1" class="card">
        <h1>AI Food Concierge 🤖</h1>
        <p>I'll read the menu so you don't have to.</p>
        <button class="btn btn-action" onclick="nextStep(1)">Start</button>
    </div>

    <div id="step-2" class="card hidden">
        <h2>Dietary Requirements?</h2>
        <button class="btn toggle-btn" onclick="toggleAllergy(this, 'Gluten')">🚫 Gluten Free</button>
        <button class="btn toggle-btn" onclick="toggleAllergy(this, 'Dairy')">🚫 Dairy Free</button>
        <button class="btn toggle-btn" onclick="toggleAllergy(this, 'Nuts')">🚫 Nut Free</button>
        <button class="btn toggle-btn" onclick="toggleAllergy(this, 'Vegetarian')">🥬 Vegetarian</button>
        <button class="btn btn-action" onclick="nextStep(2)">Next</button>
    </div>

    <div id="step-3" class="card hidden">
        <h2>Tell me what you want...</h2>
        <p style="font-size:0.9rem; color:#666;">Be honest! (e.g., "I'm super hungry and love spicy food" or "I just want something sweet and light")</p>
        <textarea id="userPrompt" placeholder="Type here..."></textarea>
        <button class="btn btn-action" onclick="callGemini()">Ask the Chef</button>
    </div>

    <div id="loading" class="card hidden">
        <h2>Thinking...</h2>
        <div class="loader"></div>
        <p>Analyzing 30+ menu items against your request.</p>
    </div>

    <div id="results" class="hidden">
        <div class="card">
            <h1>Your Menu</h1>
            <div id="ai-thought" class="ai-reasoning"></div>
            <div id="recommendation-list"></div>
            <button class="btn" onclick="location.reload()">Start Over</button>
        </div>
    </div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // *** IMPORTANT: PASTE YOUR API KEY HERE ***
    const API_KEY = "AIzaSyCuvo9oZ3sODIZ_6FAFD4185UQWum498iY"; 
    // ******************************************

    const menuData = `
    [
        {"name": "Smoked Pumpkin Soup", "tags": "Nuts, Dairy, Starter, Comfort"},
        {"name": "Tamatar Dal Ka Shorba", "tags": "Starter, Light, Healthy"},
        {"name": "Assorted Bread Rolls", "tags": "Gluten, Dairy, Side, Carbs"},
        {"name": "Chickpea, Cucumber & Feta Salad", "tags": "Dairy, Salad, Fresh"},
        {"name": "Arugula, Avocado & Grapes Salad", "tags": "Vegan, Salad, Healthy"},
        {"name": "Mexican Quinoa Salad", "tags": "Vegan, Salad, Spicy"},
        {"name": "Winter Veg Lasagna", "tags": "Gluten, Dairy, Main, Heavy, Comfort"},
        {"name": "Ratatouille", "tags": "Vegan, Main, Healthy, Light"},
        {"name": "Paneer Makhani", "tags": "Dairy, Nuts, Main, Curry, Spicy, Comfort"},
        {"name": "Thai Curries (Green/Red)", "tags": "Vegan, Main, Spicy, Coconut"},
        {"name": "Awadhi Subz Biryani", "tags": "Dairy, Main, Rice, Heavy, Spicy"},
        {"name": "Mapu Tofu", "tags": "Vegan, Main, Asian, Spicy"},
        {"name": "Chocolate Caramel Éclair", "tags": "Gluten, Dairy, Dessert, Sweet"},
        {"name": "Hazelnut Delight", "tags": "Nuts, Dairy, Dessert, Sweet"},
        {"name": "Basque Cheese Cake", "tags": "Dairy, Dessert, Rich"}
    ];` 
    // (I shortened the list slightly for code brevity, but the AI will use whatever you put here)

    let userAllergies = [];

    // Make functions globally available for buttons
    window.nextStep = (current) => {
        document.getElementById(`step-${current}`).classList.add('hidden');
        document.getElementById(`step-${current + 1}`).classList.remove('hidden');
    };

    window.toggleAllergy = (btn, allergy) => {
        if (userAllergies.includes(allergy)) {
            userAllergies = userAllergies.filter(a => a !== allergy);
            btn.classList.remove('selected');
        } else {
            userAllergies.push(allergy);
            btn.classList.add('selected');
        }
    };

    window.callGemini = async () => {
        if (API_KEY === "PASTE_YOUR_API_KEY_HERE" || API_KEY === "") {
            alert("Please edit the HTML file and add your Google API Key!");
            return;
        }

        document.getElementById('step-3').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        const userText = document.getElementById('userPrompt').value;
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        const prompt = `
        You are a helpful buffet concierge.
        Here is the menu data: ${menuData}
        
        The user has these dietary restrictions: ${userAllergies.join(", ")}.
        The user says: "${userText}".
        
        Task:
        1. Filter out ANY items that conflict with the restrictions.
        2. From the remaining items, select the top 3 that best match the user's request.
        3. Return the result in this strictly valid JSON format:
        {
            "reasoning": "A short, friendly sentence explaining why you picked these.",
            "dishes": [
                { "name": "Exact Name from Menu", "desc": "A customized 1-sentence description selling this dish to the user based on their mood." }
            ]
        }
        `;

        try {
            const result = await model.generateContent(prompt);
            const response = await result.response;
            const text = response.text();
            
            // Clean up code blocks if Gemini adds them
            const jsonString = text.replace(/```json/g, '').replace(/```/g, '');
            const data = JSON.parse(jsonString);

            renderResults(data);

        } catch (error) {
            console.error(error);
            alert("The Chef is confused. Please try again. (Check Console for error)");
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
        }
    };

    function renderResults(data) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('results').classList.remove('hidden');

        document.getElementById('ai-thought').innerText = `"${data.reasoning}"`;
        
        const list = document.getElementById('recommendation-list');
        list.innerHTML = "";

        data.dishes.forEach(dish => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.innerHTML = `
                <div class="item-name">${dish.name}</div>
                <div class="item-desc">${dish.desc}</div>
            `;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
