<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Menu Assistant</title>
    <style>
        :root { --primary: #4285F4; --bg: #f0f4f8; --card: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: #333; padding: 20px; max-width: 500px; margin: 0 auto; line-height: 1.5; }
        
        .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        h1 { color: var(--primary); margin-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #444; }
        
        textarea { width: 90%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; font-family: inherit; margin: 10px 0; resize: vertical; min-height: 80px; font-size: 1rem;}
        
        /* Model Selector Styling */
        select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 1rem; }
        label { display: block; text-align: left; font-size: 0.8rem; color: #666; margin-bottom: 5px; font-weight: bold; }

        .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #eee; border-radius: 50px; background: #fff; font-size: 1rem; cursor: pointer; transition: 0.2s; font-weight: 600; color: #555; }
        .btn.selected { background: #d0e1fd; color: var(--primary); border-color: var(--primary); }
        .btn-action { background: var(--primary); color: white; border: none; margin-top: 15px; }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .menu-item { text-align: left; background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee; }
        .item-name { font-weight: bold; font-size: 1.1rem; color: #222; }
        .item-desc { font-size: 0.95rem; color: #555; margin-top: 5px; }
        
        #error-box { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin-top: 10px; text-align: left; font-size: 0.9rem; border: 1px solid #ef9a9a;}
    </style>
</head>
<body>

    <div id="step-1" class="card">
        <h1>Buffet Genius 🍽️</h1>
        <p>Too many options? Tell me what you're craving.</p>
        <button class="btn btn-action" onclick="nextStep(1)">Get Started</button>
    </div>

    <div id="step-2" class="card hidden">
        <h2>Dietary Needs?</h2>
        <button class="btn toggle-btn" onclick="toggleAllergy(this, 'Gluten')">🚫 Gluten Free</button>
        <button class="btn toggle-btn" onclick="toggleAllergy(this, 'Dairy')">🚫 Dairy Free</button>
        <button class="btn toggle-btn" onclick="toggleAllergy(this, 'Nuts')">🚫 Nut Free</button>
        <button class="btn toggle-btn" onclick="toggleAllergy(this, 'Vegetarian')">🥬 Vegetarian</button>
        <button class="btn btn-action" onclick="nextStep(2)">Next</button>
    </div>

    <div id="step-3" class="card hidden">
        <h2>What's the vibe?</h2>
        
        <textarea id="userPrompt" placeholder="e.g. I want something spicy..."></textarea>
        
        <label for="modelSelect">System Brain (Change if error):</label>
        <select id="modelSelect">
            <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fastest)</option>
            <option value="gemini-1.5-flash-latest">Gemini 1.5 Flash (Latest)</option>
            <option value="gemini-1.0-pro">Gemini 1.0 Pro (Stable)</option>
            <option value="gemini-pro">Gemini Pro (Legacy)</option>
        </select>

        <button class="btn btn-action" onclick="callGeminiDirect()">Ask the Chef</button>
        <div id="error-box" class="hidden"></div>
    </div>

    <div id="loading" class="card hidden">
        <h2>Consulting the Chef...</h2>
        <div class="loader"></div>
    </div>

    <div id="results" class="hidden">
        <div class="card">
            <h1>Recommendations</h1>
            <div id="ai-thought" style="background:#eef; padding:15px; border-radius:12px; margin-bottom:20px; text-align:left; font-style:italic;"></div>
            <div id="recommendation-list"></div>
            <button class="btn" onclick="location.reload()">Start Over</button>
        </div>
    </div>

<script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const API_KEY = "AIzaSyCuvo9oZ3sODIZ_6FAFD4185UQWum498iY";
    
    // We will build the URL dynamically based on the dropdown selection
    const BASE_URL = "https://generativelanguage.googleapis.com/v1beta/models/";

    const menuData = `[
        { "name": "Smoked Pumpkin Soup", "allergens": "Nuts, Dairy" },
        { "name": "Tamatar Dal Ka Shorba", "allergens": "None" },
        { "name": "Assorted Bread Rolls", "allergens": "Gluten, Dairy" },
        { "name": "Chickpea, Cucumber & Feta Salad", "allergens": "Dairy" },
        { "name": "Arugula, Avocado & Grapes Salad", "allergens": "None" },
        { "name": "Mexican Quinoa Salad", "allergens": "None" },
        { "name": "Winter Veg Lasagna", "allergens": "Gluten, Dairy" },
        { "name": "Paneer Makhani", "allergens": "Dairy, Nuts" },
        { "name": "Thai Curries (Green/Red)", "allergens": "None" },
        { "name": "Chocolate Caramel Éclair", "allergens": "Gluten, Dairy" },
        { "name": "Hazelnut Delight", "allergens": "Nuts, Dairy" },
        { "name": "Basque Cheese Cake", "allergens": "Dairy" }
    ]`;

    let userAllergies = [];

    window.nextStep = (current) => {
        document.getElementById(`step-${current}`).classList.add('hidden');
        document.getElementById(`step-${current + 1}`).classList.remove('hidden');
    };

    window.toggleAllergy = (btn, allergy) => {
        if (userAllergies.includes(allergy)) {
            userAllergies = userAllergies.filter(a => a !== allergy);
            btn.classList.remove('selected');
        } else {
            userAllergies.push(allergy);
            btn.classList.add('selected');
        }
    };

    // --- DIRECT API CALL FUNCTION ---
    window.callGeminiDirect = async () => {
        const errorBox = document.getElementById('error-box');
        errorBox.classList.add('hidden');
        document.getElementById('step-3').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        const userText = document.getElementById('userPrompt').value;
        const selectedModel = document.getElementById('modelSelect').value;

        // Construct the URL dynamically
        const API_URL = `${BASE_URL}${selectedModel}:generateContent?key=${API_KEY}`;

        // Construct the prompt
        const promptText = `
        You are a buffet assistant.
        Menu: ${menuData}
        User Restrictions: ${userAllergies.join(", ")}
        User Request: "${userText}"
        
        Task: Pick 3 items. 
        IMPORTANT: Return ONLY valid JSON. No markdown formatting.
        JSON Structure:
        {
            "reasoning": "One sentence explaining choice.",
            "dishes": [ { "name": "Dish Name", "desc": "Short description" } ]
        }
        `;

        // The Data Payload
        const payload = {
            contents: [{
                parts: [{ text: promptText }]
            }]
        };

        try {
            console.log("Trying model:", selectedModel);
            
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            // Check for API Errors
            if (!response.ok) {
                // If it fails, throw error so we can show it
                throw new Error(`Model ${selectedModel} failed: ${data.error?.message || response.statusText}`);
            }

            // Extract the text answer
            const aiText = data.candidates[0].content.parts[0].text;
            console.log("Raw AI Response:", aiText);

            // Clean and Parse JSON
            const firstBrace = aiText.indexOf('{');
            const lastBrace = aiText.lastIndexOf('}');
            if (firstBrace === -1) throw new Error("AI did not return JSON");
            
            const cleanJson = aiText.substring(firstBrace, lastBrace + 1);
            const resultData = JSON.parse(cleanJson);

            renderResults(resultData);

        } catch (error) {
            console.error(error);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
            errorBox.classList.remove('hidden');
            errorBox.innerText = "⚠️ " + error.message + "\n\n👉 TIP: Try selecting a different 'System Brain' in the dropdown above!";
        }
    };

    function renderResults(data) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('results').classList.remove('hidden');

        document.getElementById('ai-thought').innerText = data.reasoning;
        const list = document.getElementById('recommendation-list');
        list.innerHTML = "";

        data.dishes.forEach(dish => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.innerHTML = `
                <div class="item-name">${dish.name}</div>
                <div class="item-desc">${dish.desc}</div>
            `;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
